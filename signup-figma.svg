<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Page background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#FFF7F0"/>
    </linearGradient>

    <!-- Brand gradient (purple → peach) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E5BFF"/>
      <stop offset="100%" stop-color="#FEA971"/>
    </linearGradient>

    <!-- Heading gradient (horizontal) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E5BFF"/>
      <stop offset="100%" stop-color="#FEA971"/>
    </linearGradient>

    <!-- Card drop shadow -->
    <filter id="cardShadow" x="-6%" y="-4%" width="112%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Small drop shadow (logo, button) -->
    <filter id="smallShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ──────────────────────────────────────── -->
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- ── LOGO MARK ───────────────────────────────────────── -->
  <circle cx="720" cy="96" r="28" fill="url(#brandGrad)" filter="url(#smallShadow)"/>
  <!-- Sun icon, white, centred in logo circle -->
  <g transform="translate(720,96)" stroke="white" stroke-linecap="round">
    <circle r="5" fill="white" stroke="none"/>
    <line x1="0" y1="-13" x2="0" y2="-8.5" stroke-width="2"/>
    <line x1="0" y1="8.5" x2="0" y2="13" stroke-width="2"/>
    <line x1="-13" y1="0" x2="-8.5" y2="0" stroke-width="2"/>
    <line x1="8.5" y1="0" x2="13" y2="0" stroke-width="2"/>
    <line x1="-9.2" y1="-9.2" x2="-6" y2="-6" stroke-width="1.5"/>
    <line x1="6" y1="6" x2="9.2" y2="9.2" stroke-width="1.5"/>
    <line x1="9.2" y1="-9.2" x2="6" y2="-6" stroke-width="1.5"/>
    <line x1="-6" y1="6" x2="-9.2" y2="9.2" stroke-width="1.5"/>
  </g>

  <!-- ── HEADING ─────────────────────────────────────────── -->
  <text x="720" y="156"
    text-anchor="middle"
    font-family="Georgia, 'Playfair Display', serif"
    font-size="34" font-weight="700"
    fill="url(#textGrad)">Join Lit Up</text>

  <!-- Subtitle -->
  <text x="720" y="178"
    text-anchor="middle"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" fill="#6B7280">
    Connect with trusted lightworkers, or share your gifts with the world.
  </text>

  <!-- ── CARD ────────────────────────────────────────────── -->
  <rect x="496" y="198" width="448" height="496" rx="12" fill="white" filter="url(#cardShadow)"/>

  <!-- Card inner content — left edge at x=528 (496+32), width=384 -->

  <!-- Role selector label -->
  <text x="528" y="244"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" font-weight="500" fill="#374151">I am joining as…</text>

  <!-- ── ROLE CARD: SEEKER (selected) ───────────────────── -->
  <rect x="528" y="254" width="185" height="90" rx="12"
    fill="#F5F3FF" stroke="#7E5BFF" stroke-width="2"/>
  <!-- Compass icon -->
  <g transform="translate(548,279)" fill="none" stroke="#7E5BFF" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <circle r="10"/>
    <!-- Compass needle (diamond) -->
    <polygon points="4.2,-4.2 2.1,2.1 -4.2,4.2 -2.1,-2.1"
      fill="#7E5BFF" fill-opacity="0.35" stroke="#7E5BFF" stroke-width="1.2"/>
  </g>
  <text x="544" y="311"
    font-family="system-ui, Inter, sans-serif"
    font-size="12" font-weight="600" fill="#111827">A Seeker</text>
  <text x="544" y="328"
    font-family="system-ui, Inter, sans-serif"
    font-size="11" fill="#9CA3AF">Find my healer</text>

  <!-- ── ROLE CARD: PRACTITIONER (unselected) ───────────── -->
  <rect x="725" y="254" width="185" height="90" rx="12"
    fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <!-- Sparkle / star icon -->
  <g transform="translate(745,279) scale(0.83) translate(-12,-12)"
     fill="none" stroke="#9CA3AF" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12
             l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21
             l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12
             l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/>
  </g>
  <text x="741" y="311"
    font-family="system-ui, Inter, sans-serif"
    font-size="12" font-weight="600" fill="#111827">A Practitioner</text>
  <text x="741" y="328"
    font-family="system-ui, Inter, sans-serif"
    font-size="11" fill="#9CA3AF">Grow my practice</text>

  <!-- ── FULL NAME FIELD ─────────────────────────────────── -->
  <text x="528" y="372"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" font-weight="500" fill="#374151">Full name</text>
  <rect x="528" y="382" width="384" height="44" rx="12"
    fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="544" y="409"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" fill="#9CA3AF">Your name</text>

  <!-- ── EMAIL FIELD ─────────────────────────────────────── -->
  <text x="528" y="452"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" font-weight="500" fill="#374151">Email address</text>
  <rect x="528" y="462" width="384" height="44" rx="12"
    fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="544" y="489"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" fill="#9CA3AF">you@example.com</text>

  <!-- ── PASSWORD FIELD ──────────────────────────────────── -->
  <text x="528" y="532"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" font-weight="500" fill="#374151">Password</text>
  <rect x="528" y="542" width="384" height="44" rx="12"
    fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="544" y="569"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" fill="#9CA3AF">Min. 8 characters</text>

  <!-- ── SUBMIT BUTTON ───────────────────────────────────── -->
  <rect x="528" y="604" width="384" height="48" rx="12"
    fill="url(#brandGrad)" filter="url(#smallShadow)"/>
  <text x="720" y="634"
    text-anchor="middle"
    font-family="system-ui, Inter, sans-serif"
    font-size="14" font-weight="600" fill="white">Begin your journey</text>

  <!-- ── SIGN IN LINK ────────────────────────────────────── -->
  <text x="720" y="674"
    text-anchor="middle"
    font-family="system-ui, Inter, sans-serif"
    font-size="12" fill="#9CA3AF">Already a member?</text>
  <text x="820" y="674"
    font-family="system-ui, Inter, sans-serif"
    font-size="12" font-weight="500" fill="#7E5BFF">Sign in</text>

  <!-- ── FOOTER ──────────────────────────────────────────── -->
  <text x="720" y="724"
    text-anchor="middle"
    font-family="system-ui, Inter, sans-serif"
    font-size="12" fill="#9CA3AF">All practitioners on Lit Up are vetted for authenticity.</text>
  <text x="720" y="742"
    text-anchor="middle"
    font-family="system-ui, Inter, sans-serif"
    font-size="12" fill="#7E5BFF">Learn how →</text>

  <!-- ── ANNOTATION LAYER (dim) ─────────────────────────── -->
  <!-- Color swatches bottom-left for reference -->
  <g transform="translate(40, 820)">
    <rect width="16" height="16" rx="3" fill="#7E5BFF"/>
    <text x="22" y="13" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">#7E5BFF  Primary</text>
    <rect x="140" width="16" height="16" rx="3" fill="#FEA971"/>
    <text x="162" y="13" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">#FEA971  Accent</text>
    <rect x="280" width="16" height="16" rx="3" fill="#111827"/>
    <text x="302" y="13" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">#111827  Text</text>
    <rect x="400" width="16" height="16" rx="3" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
    <text x="422" y="13" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">#E5E7EB  Border</text>
    <text x="560" y="13" font-family="system-ui, sans-serif" font-size="11" fill="#9CA3AF">Radius: 12px  ·  Shadow: 0 2px 6px rgba(0,0,0,.15)  ·  Motion: 150ms ease-out</text>
  </g>
</svg>
